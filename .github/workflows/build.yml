name: Build distributables

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            command: npm run dist:win
          - name: Linux x64
            os: ubuntu-latest
            command: npm run dist:linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: ${{ matrix.command }} -- --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: cue-player-pad-${{ runner.os }}-x64
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.AppImage